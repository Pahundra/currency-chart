<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>График акций</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b0e11;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px 0;
            color: #f0b90b;
            text-align: center;
        }
        .stock-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .stock-btn {
            background: #1e2329;
            border: 1px solid #2b3139;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stock-btn.active {
            background: #f0b90b;
            color: #0b0e11;
            border-color: #f0b90b;
            font-weight: 600;
        }
        .style-selector, .interval-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .style-btn, .interval-btn {
            background: #1e2329;
            border: 1px solid #2b3139;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .style-btn.active, .interval-btn.active {
            background: #2b3139;
            border-color: #f0b90b;
            color: #f0b90b;
        }
        .chart-container {
            width: 100%;
            height: 450px;
            background: #1e2329;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid #2b3139;
        }
        .info-note {
            background: #1e2329;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            color: #848e9c;
            font-size: 13px;
            border: 1px solid #2b3139;
        }
        footer {
            margin-top: 20px;
            color: #848e9c;
            font-size: 12px;
            text-align: center;
        }
        a {
            color: #f0b90b;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 График акций</h1>

        <!-- Выбор акции / индекса -->
        <div class="stock-selector">
            <button class="stock-btn active" data-symbol="AAPL">Apple</button>
            <button class="stock-btn" data-symbol="TSLA">Tesla</button>
            <button class="stock-btn" data-symbol="GOOGL">Google</button>
            <button class="stock-btn" data-symbol="MSFT">Microsoft</button>
            <button class="stock-btn" data-symbol="SPX">S&P 500</button>
        </div>

        <!-- Выбор стиля графика -->
        <div class="style-selector">
            <button class="style-btn active" data-style="1">📊 Свечи</button>
            <button class="style-btn" data-style="2">📈 Линия</button>
            <button class="style-btn" data-style="3">📉 Бары</button>
            <button class="style-btn" data-style="4">🟦 Область</button>
        </div>

        <!-- Выбор таймфрейма -->
        <div class="interval-selector">
            <button class="interval-btn" data-interval="15">15м</button>
            <button class="interval-btn active" data-interval="60">1ч</button>
            <button class="interval-btn" data-interval="240">4ч</button>
            <button class="interval-btn" data-interval="D">1д</button>
        </div>

        <!-- Контейнер для графика -->
        <div class="chart-container" id="tradingview_widget"></div>

        <!-- Пояснение -->
        <div class="info-note">
            📍 Цена и данные отображаются на графике (легенда сверху).
            Источник: TradingView
        </div>

        <footer>
            <a href="https://t.me/MLLT_bot" target="_blank">@MLLT_bot</a>
        </footer>
    </div>

    <!-- TradingView Widget Script -->
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Текущие настройки
        let currentSymbol = 'AAPL';
        let currentStyle = 1;
        let currentInterval = '60';
        let widget = null;

        // Получить символ для TradingView
        function getTradingViewSymbol(symbol) {
            const map = {
                'AAPL': 'NASDAQ:AAPL',
                'TSLA': 'NASDAQ:TSLA',
                'GOOGL': 'NASDAQ:GOOGL',
                'MSFT': 'NASDAQ:MSFT',
                'SPX': 'SPX',
            };
            return map[symbol] || 'NASDAQ:AAPL';
        }

        // Создание/обновление виджета
        function createWidget(symbol, style, interval) {
            const container = document.getElementById('tradingview_widget');
            container.innerHTML = '';
            const tvSymbol = getTradingViewSymbol(symbol);

            widget = new TradingView.widget({
                container_id: 'tradingview_widget',
                width: '100%',
                height: '100%',
                symbol: tvSymbol,
                interval: interval,
                timezone: 'Europe/Moscow',
                theme: 'dark',
                style: String(style),
                locale: 'ru',
                hide_top_toolbar: true,
                hide_legend: false,
                allow_symbol_change: false,
                save_image: false,
                enable_publishing: false,
                toolbar_bg: '#0b0e11'
            });
        }

        // --- Обработчики кнопок ---

        // Выбор акции
        document.querySelectorAll('.stock-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.stock-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSymbol = this.dataset.symbol;
                createWidget(currentSymbol, currentStyle, currentInterval);
            });
        });

        // Выбор стиля
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentStyle = parseInt(this.dataset.style);
                createWidget(currentSymbol, currentStyle, currentInterval);
            });
        });

        // Выбор интервала
        document.querySelectorAll('.interval-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.interval-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentInterval = this.dataset.interval;
                createWidget(currentSymbol, currentStyle, currentInterval);
            });
        });

        // Инициализация: Apple, свечи, 1ч
        createWidget('AAPL', 1, '60');
    </script>
</body>
</html>
